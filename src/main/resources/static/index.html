<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select a Problem</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main class="container">
        <h1>Problem Selection</h1>

        <label for="problemSelect">Select a problem:</label>

        <select id="problemSelect">
            <option value="" selected disabled>Choose a problem...</option>
            <option value="Problem 1">No internet conection</option>
            <option value="Problem 2">PC wont't turn on</option>
            <option value="Problem 3">Lamp isn't working</option>
            <option value="Problem 4">Projector isn't working</option>
            <option value="Problem 5">Other problem</option>
        </select>

        <div id="other">
        <label for="problemDetails">
            Please describe your problem:
        </label>
        <br>
        <textarea 
            id="problemDetails"
            rows="4"
            cols="40"
            placeholder="What happen?">
        </textarea>
    </div>

        <p id="selectedProblem">No problem selected.</p>
    </main>

<script src="/js/script.js"></script>
</body>
</html>
