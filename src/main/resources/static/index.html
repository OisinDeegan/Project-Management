<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select a Problem</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main class="container">
        <h1>Problem Selection</h1>

        <label for="problemSelect">Select a problem:</label>

        <select id="problemSelect">
            <option value="" selected disabled>Choose a problem...</option>
            <option value="Problem 1">Problem 1</option>
            <option value="Problem 2">Problem 2</option>
            <option value="Problem 3">Problem 3</option>
            <option value="Problem 4">Problem 4</option>
            <option value="Problem 5">Problem 5</option>
        </select>

        <p id="selectedProblem">No problem selected.</p>
    </main>

<script src="/js/script.js"></script>
</body>
</html>
